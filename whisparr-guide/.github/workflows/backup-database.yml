name: 🔄 Daily Whisparr Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # في الساعة 2 صباحاً كل يوم
  workflow_dispatch:  # تشغيل يدوي

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup environment
        run: |
          mkdir -p backups
          echo "BACKUP_DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: 💾 Backup PostgreSQL Database
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -d whisparr-main > backups/whisparr-main-${{ env.BACKUP_DATE }}.sql
          PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -d whisparr-log > backups/whisparr-log-${{ env.BACKUP_DATE }}.sql
          gzip backups/*.sql

      - name: 📤 Upload to GitHub Actions artifacts
        uses: actions/upload-artifact@v3
        with:
          name: whisparr-backup-${{ env.BACKUP_DATE }}
          path: backups/
          retention-days: 30

      - name: 💬 Send Discord notification
        if: always()
        uses: tsickert/discord-webhook@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            🔄 **Whisparr Database Backup**
            Status: ${{ job.status }}
            Date: ${{ env.BACKUP_DATE }}
            Backup files uploaded to GitHub Actions artifacts

      - name: 📱 Send Telegram notification
        if: always()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ تم عمل نسخة احتياطية من قاعدة بيانات Whisparr - ${{ env.BACKUP_DATE }}"
